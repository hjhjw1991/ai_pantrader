name: Bug 报告 / Bug report
description: 系统行为与预期不符
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **请不要贴真实持仓、账户信息或数据库文件。**
        Please don't paste real positions, account details, or your database file.

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前 / Before filing
      options:
        - label: 我在**干净检出**上跑过 `pnpm test`（如果这一步就红了，请在下面说明）
          required: false
        - label: 我搜过已有 issue，没找到重复的 / I searched existing issues
          required: false

  - type: textarea
    id: doctor
    attributes:
      label: 环境体检输出 / Environment check-up
      description: |
        跑 `node scripts/doctor.mjs`，把**整段**输出贴进来。
        它包含平台、Node 版本与 ABI、项目版本与 commit、原生模块状态、磁盘、定时任务指向 ——
        这一段能省掉大半轮来回。

        Run `node scripts/doctor.mjs` and paste the **whole** output. It covers platform,
        Node version and ABI, project version and commit, native module state, disk, and
        where the scheduled tasks point.
      placeholder: |
        候潮 环境体检　只读，不会改任何东西

          ✓ Node 版本       24.11.1（ABI 137，engines >=22）
          ✓ 平台            darwin arm64　内存 48.0 GB
          ✓ 版本            pantrader 0.1.0　7e84b25
          ...
      render: text
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 实际行为 vs 预期行为。**有报错请贴原文，别转述** —— 转述会丢掉关键的错误码。
      placeholder: |
        预期：…
        实际：…
        报错原文：
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 怎么复现 / How to reproduce
      description: |
        最小步骤。如果与具体数据有关，说明是**哪一类**数据（例如"某只当天停牌的票"），
        不用给真实数据。如果只偶发，说明大概多久出现一次。
      placeholder: |
        1. …
        2. …
        3. 出现 …
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪块 / Area
      multiple: true
      options:
        - 安装与环境 / setup & environment
        - 数据采集 / collection
        - 策略与因子 / strategy & factors
        - 回测 / backtest
        - 台账复盘 / ledger
        - 网页界面 / web UI
        - 定时任务 / scheduling
        - 导入导出 / import & export
        - 不确定 / not sure

  - type: textarea
    id: extra
    attributes:
      label: 其它 / Anything else
      description: 可选。你试过什么、什么时候开始出现、相关日志（`~/PanTraderData/logs/`，注意脱敏）。
