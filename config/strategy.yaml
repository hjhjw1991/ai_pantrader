# PanTrader 默认策略。
#
# 这份文件是参数的**唯一真相源**（决策 D7）。参数面板只是它的投影：
# 面板上改一个数字 = 改这里的一行，不存在第二份状态、不存在数据库里的副本。
# 高级规则（因子之间的关系判断）直接手写在这里，不必等面板支持。
#
# 每个阈值下面的注释记的是"为什么是这个数"。改数字前先读它 ——
# 这些注释是几次真金白银的复盘留下来的，写回参数时 loader 会原样保留它们。

id: default
# 语义化版本。改了任何阈值都该升 patch，改了规则结构升 minor ——
# 否则历史回测结论无法归因到具体的哪一版参数（spec §9.2）。
version: 1.0.0

择时:
  # 三档只有三个数字，但语义差别是根本性的：
  # 防守 = 0，**不是"轻仓"**。留一成仓位过冬是最常见的自我安慰，
  # 结果是纪律形同虚设：既然还有仓位，就还会盯、还会补、还会扛。
  仓位档位:  { 进攻: 0.7, 中性: 0.4, 防守: 0.0 }
  # 任一条件成立即进防守。键名后缀 ">" 表示"因子值大于该阈值时触发"。
  # 权重杀跌 当前**没有对应因子**（需要指数成分股口径），引擎会把它列进
  # 信号卡 warnings 的"未判定条件"，而不是当成 false 悄悄放过 ——
  # 缺数据的条件静默通过，等于宣称"防守条件全查过了"，那是最危险的假阳性。
  防守触发:  { 跌停家数>: 30, 权重杀跌: true, 外围risk_off: true }

选股:
  # 七道筛的阈值。位置涨幅上限 50 = 近 20 日已涨 50% 以上不再新开仓：
  # 用户的目标是牛市长期稳定盈利，不打板不超短，追高段的胜率与他的执行方式不匹配。
  过滤器阈值: { 位置涨幅上限: 50, 换手上限: 15, 振幅上限: 10 }
  # 必查链是**叠加**项，不是替换项：写空数组也照扫那四条链（spec §8.2 写死）。
  # 原因是 2026-07-27 的主线级漏扫 —— 板块涨幅榜给的是均值，
  # 一条链里几十只票拖后腿能把均值压到第 9 名，而链内已有 3 板龙头在封板。
  主线识别:  { 板块涨幅榜TopN: 3, 必查链: [半导体全链, 军工, 电网, 资源] }

持仓:
  # 两个账户的语义完全不同，止损规则不可混用。
  # 贼王账户吃波动：止损是价格纪律，机械执行。
  贼王账户:  { 止损: -0.05, 灾难位: -0.08, 止损确认: 收盘, 止盈: [0.08减半, 0.15清] }
  # 止损确认: 收盘 —— 盘中破位不立刻砍。
  # 政策底/外围硬驱动的反弹日，盘中单次冲高回落多数是洗盘不是见光死（2026-07-21 实盘验证过）。
  # 灾难位 -0.08 是例外：跌破它不等收盘，直接走。这就是"灾难位"存在的意义。
  #
  # 价值账户扛逻辑：止损条件是"逻辑破坏"而不是一个百分比，
  # 所以它没有机械止损价，引擎不会给这类持仓填 stopPx，只会提示复核逻辑。
  价值账户:  { 止损: 逻辑破坏, 加仓: 逆势分批 }

组合风控:
  # 上限而非目标。实际总仓位 = min(总仓位上限, 档位仓位)。
  总仓位上限: 0.8
  # 单票 15%：一只票踩到灾难位 -8%，对总资产的伤害约 1.2%，一天能消化。
  单票最大占比: 0.15
  # 单行业 35%：自选股偏半导体电子链，同源票一起跌时"分散"是假的。
  # 这条上限是对"看着是 5 只票、其实是 1 个赌注"的硬约束。
  单行业最大占比: 0.35
  # 核心=真业绩合理估值的长期仓（价值账户），卫星=波动仓（贼王账户）。
  核心卫星比例: { 核心: 0.6, 卫星: 0.4 }
